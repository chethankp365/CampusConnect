<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Campus Connect hero banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff5a1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4d1a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff4d1a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="440" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="440" fill="url(#bg)"/>
    <rect width="1200" height="440" fill="url(#grid)"/>

    <!-- scanning line -->
    <rect x="0" y="0" width="1200" height="2" fill="#b6ff3b" opacity="0.12">
      <animate attributeName="y" values="0;440;0" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- glow behind globe -->
    <circle cx="930" cy="220" r="230" fill="url(#glow)">
      <animate attributeName="r" values="210;245;210" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- ===== LEFT: text ===== -->
    <g font-family="'SF Mono','Fira Code',Consolas,'Courier New',monospace">
      <rect x="64" y="64" width="276" height="30" rx="6" fill="none" stroke="#b6ff3b" stroke-opacity="0.8"/>
      <text x="80" y="84" font-size="13" letter-spacing="2" fill="#b6ff3b">INTER-COLLEGE // LIVE NETWORK</text>
      <circle cx="322" cy="79" r="4" fill="#b6ff3b">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700">
      <text x="64" y="190" font-size="78" fill="url(#title)" letter-spacing="-3" opacity="0">
        Campus Connect
        <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.9s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 24" to="0 0" begin="0.2s" dur="0.9s" fill="freeze"/>
      </text>
      <text x="636" y="150" font-size="64" fill="#ff4d1a">✱
        <animateTransform attributeName="transform" type="rotate" values="0 650 128;360 650 128" dur="14s" repeatCount="indefinite"/>
      </text>
    </g>

    <g font-family="'Helvetica Neue',Arial,sans-serif">
      <text x="66" y="244" font-size="26" fill="#e8e8ea" opacity="0">
        One unified grid across every campus.
        <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.9s" fill="freeze"/>
      </text>
    </g>

    <!-- rotating keyword line -->
    <g font-family="'SF Mono','Fira Code',Consolas,'Courier New',monospace" font-size="17">
      <text x="66" y="290" fill="#8d8d95" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.6s" fill="freeze"/>
        &gt; find
      </text>
      <g fill="#ff4d1a" font-weight="700">
        <text x="130" y="290" opacity="0">study notes
          <animate attributeName="opacity" values="0;1;1;0;0;0;0;0;0" keyTimes="0;0.04;0.22;0.26;0.5;0.75;1;1;1" dur="12s" begin="1.8s" repeatCount="indefinite"/>
        </text>
        <text x="130" y="290" opacity="0" fill="#b6ff3b">campus events
          <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.3;0.47;0.51;1" dur="12s" begin="1.8s" repeatCount="indefinite"/>
        </text>
        <text x="130" y="290" opacity="0" fill="#22d3ee">teammates
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.54;0.72;0.76;1" dur="12s" begin="1.8s" repeatCount="indefinite"/>
        </text>
        <text x="130" y="290" opacity="0" fill="#a78bfa">opportunities
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.79;0.96;1" dur="12s" begin="1.8s" repeatCount="indefinite"/>
        </text>
      </g>
      <rect x="290" y="274" width="9" height="19" fill="#e8e8ea" opacity="0.8">
        <animate attributeName="opacity" values="0.9;0;0.9" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- drifting particles -->
    <g fill="#ffffff">
      <circle cx="140" cy="420" r="1.5" opacity="0.25"><animate attributeName="cy" values="430;20" dur="14s" repeatCount="indefinite"/></circle>
      <circle cx="380" cy="430" r="1.2" opacity="0.2"><animate attributeName="cy" values="440;20" dur="18s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="430" r="1.8" opacity="0.25"><animate attributeName="cy" values="440;20" dur="16s" begin="6s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="430" r="1.2" opacity="0.2"><animate attributeName="cy" values="440;20" dur="20s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="430" r="1.5" opacity="0.25"><animate attributeName="cy" values="440;20" dur="15s" begin="8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- tag chips -->
    <g font-family="'SF Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13">
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.6s" fill="freeze"/>
        <rect x="64" y="332" width="128" height="34" rx="17" fill="#ff4d1a"/>
        <text x="128" y="354" text-anchor="middle" fill="#fff" font-weight="700">Live on Vercel</text>
        <rect x="204" y="332" width="150" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
        <text x="279" y="354" text-anchor="middle" fill="#d7d7db">pgvector + RAG</text>
        <rect x="366" y="332" width="150" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
        <text x="441" y="354" text-anchor="middle" fill="#d7d7db">Row Level Security</text>
      </g>
    </g>

    <!-- ===== RIGHT: orbiting network ===== -->
    <g transform="translate(930 220)">
      <!-- orbit rings -->
      <ellipse rx="190" ry="70" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-dasharray="3 7">
        <animateTransform attributeName="transform" type="rotate" values="-20;340" dur="40s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="150" ry="150" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
      <ellipse rx="190" ry="70" fill="none" stroke="#ff4d1a" stroke-opacity="0.35" stroke-dasharray="2 9">
        <animateTransform attributeName="transform" type="rotate" values="50;-310" dur="55s" repeatCount="indefinite"/>
      </ellipse>

      <!-- globe -->
      <circle r="92" fill="#0a0e18" stroke="#22d3ee" stroke-opacity="0.5"/>
      <g fill="none" stroke="#22d3ee" stroke-opacity="0.35">
        <ellipse rx="92" ry="30"/>
        <ellipse rx="92" ry="60"/>
        <ellipse rx="30" ry="92">
          <animate attributeName="rx" values="8;92;8" dur="8s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse rx="62" ry="92">
          <animate attributeName="rx" values="62;8;62;92;62" dur="8s" repeatCount="indefinite"/>
        </ellipse>
        <line x1="-92" y1="0" x2="92" y2="0"/>
      </g>

      <!-- campus nodes on orbit -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
        <circle cx="150" cy="0" r="6" fill="#ff4d1a"/>
        <circle cx="-120" cy="-90" r="5" fill="#b6ff3b"/>
        <circle cx="-60" cy="140" r="5" fill="#22d3ee"/>
        <circle cx="90" cy="-125" r="4" fill="#ffffff"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
        <circle cx="185" cy="30" r="5" fill="#b6ff3b"/>
        <circle cx="-170" cy="40" r="6" fill="#ff4d1a"/>
        <circle cx="20" cy="-175" r="4" fill="#22d3ee"/>
      </g>

      <!-- pulse -->
      <circle r="92" fill="none" stroke="#22d3ee" stroke-width="1.5">
        <animate attributeName="r" values="92;190" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="92" fill="none" stroke="#ff4d1a" stroke-width="1.5">
        <animate attributeName="r" values="92;190" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
      </circle>

      <!-- center label -->
      <text y="6" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,monospace" font-size="15" fill="#e8e8ea" letter-spacing="2">15 CAMPUSES</text>
    </g>

    <!-- footer ticker line -->
    <line x1="64" y1="404" x2="1136" y2="404" stroke="#ffffff" stroke-opacity="0.08"/>
    <line x1="64" y1="404" x2="364" y2="404" stroke="#ff4d1a" stroke-width="2">
      <animate attributeName="x1" values="64;836;64" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="364;1136;364" dur="7s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
