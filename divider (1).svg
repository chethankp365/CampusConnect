<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="1200" height="40" role="presentation">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d8d95" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8d8d95" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8d8d95" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d1a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff4d1a"/>
      <stop offset="1" stop-color="#ff4d1a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line x1="60" y1="20" x2="1140" y2="20" stroke="url(#fade)" stroke-width="1"/>

  <!-- sweeping beam -->
  <rect x="60" y="19" width="220" height="2" fill="url(#beam)">
    <animate attributeName="x" values="60;920;60" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- centre node -->
  <g transform="translate(600 20)">
    <circle r="9" fill="none" stroke="#ff4d1a" stroke-opacity="0.7">
      <animate attributeName="r" values="6;16" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#ff4d1a"/>
    <g fill="#8d8d95" fill-opacity="0.6">
      <circle cx="-34" r="2"/><circle cx="34" r="2"/>
      <circle cx="-68" r="1.5"/><circle cx="68" r="1.5"/>
    </g>
    <g stroke="#b6ff3b" stroke-opacity="0.5" fill="none">
      <path d="M-30 0H-6M6 0H30">
        <animate attributeName="stroke-dasharray" values="0 30;24 6;0 30" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
